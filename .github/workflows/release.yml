name: Release

# 프로그램의 릴리스 이름(app_manifest.json의 "release", 예: AOI_Photo_Sorter_v1)으로
# 태그를 푸시하면, 테스트를 통과한 경우에만 그 프로그램의 ZIP을 만들어 GitHub 릴리스로 게시한다.
#   git tag AOI_Photo_Sorter_v1 && git push origin AOI_Photo_Sorter_v1
# 태그를 직접 푸시할 수 없으면 Actions 탭에서 이 워크플로를 실행(Run workflow)한다:
# 실행한 브랜치의 현재 커밋에 태그를 만들어 게시한다. 태그가 이미 있으면(예: GitHub 화면에서
# 릴리스를 먼저 만든 경우) 지금 커밋의 programs/ 가 태그와 같을 때만 그 릴리스에 ZIP을 올린다.
# 릴리스가 이미 있으면 새로 만들지 않고 ZIP·제목·노트를 채운다.
on:
  push:
    tags: ['*_v*']
  workflow_dispatch:
    inputs:
      release:
        description: '릴리스 이름 (app_manifest.json의 "release", 예: AOI_Photo_Sorter_v1)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.release || github.ref_name }}

concurrency:
  group: release-${{ inputs.release || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check an existing tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            # Only publish when this commit builds exactly the program files the tag points at.
            git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
            if ! git diff --quiet "refs/tags/${TAG}" HEAD -- programs; then
              echo "::error::태그 ${TAG} 가 이미 있고 programs/ 내용이 지금 커밋과 다릅니다. 새 릴리스 이름(버전)을 쓰세요."
              exit 1
            fi
            echo "태그 ${TAG} 가 이미 있음: 프로그램 파일이 같으므로 그 릴리스에 ZIP을 올립니다."
          fi

      - name: Find the program for this tag
        id: program
        run: |
          python - <<'EOF'
          import json, os, pathlib, sys
          tag = os.environ['TAG']
          for manifest in sorted(pathlib.Path('programs').glob('*/app_files/app_manifest.json')):
              data = json.loads(manifest.read_text(encoding='utf-8'))
              if data['release'] == tag:
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                      out.write('dir=%s\n' % manifest.parent.parent.name)
                      out.write('title=%s\n' % data['title'])
                  sys.exit(0)
          sys.exit('no program has the release name %s (app_manifest.json "release")' % tag)
          EOF

      - name: Install test dependencies
        timeout-minutes: 15
        run: |
          python -m pip install --upgrade pip
          pip install -c programs/AOI_Photo_Sorter/app_files/constraints.txt pywebview Pillow openpyxl numpy matplotlib playwright
          python -m playwright install chromium
          # The runner image already has Chrome's system libraries. apt (install-deps) only runs
          # when the browser cannot start: an unreachable Ubuntu mirror once hung it for 30 min.
          if ! python - <<'EOF'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              p.chromium.launch().close()
          EOF
          then
            timeout 600 python -m playwright install-deps chromium
          fi

      - name: Tests
        env:
          AOI_TOOLS_HOME: ${{ runner.temp }}/aoi_tools
        run: |
          python -m unittest discover -s tests -v
          python -m unittest tests.e2e_photo_sorter -v

      - name: Build ZIP
        run: |
          python tools/build_release.py --zip
          # the committed .vbs launchers must be exactly what the template generates
          git diff --exit-code -- programs
          test -f "dist/${TAG}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.program.outputs.title }}
          DIR: ${{ steps.program.outputs.dir }}
        run: |
          notes="docs/releases/${TAG}.md"
          [ -f "$notes" ] || notes="programs/${DIR}/README_KO.txt"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # created on the GitHub page first (that also made the tag): attach the ZIP, fill in title/notes
            gh release upload "$TAG" "dist/${TAG}.zip" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$notes"
          else
            verify=()
            [ "$GITHUB_EVENT_NAME" = push ] && verify=(--verify-tag)
            # manual run: gh creates the tag on the commit that was tested and built
            gh release create "$TAG" "dist/${TAG}.zip" "${verify[@]}" --target "$GITHUB_SHA" \
              --title "$TITLE" --notes-file "$notes"
          fi
