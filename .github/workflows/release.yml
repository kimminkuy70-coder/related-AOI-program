name: Release

# 프로그램의 릴리스 이름(app_manifest.json의 "release", 예: AOI_Photo_Sorter_v1)으로
# 태그를 푸시하면, 테스트를 통과한 경우에만 그 프로그램의 ZIP을 만들어 GitHub 릴리스로 게시한다.
#   git tag AOI_Photo_Sorter_v1 && git push origin AOI_Photo_Sorter_v1
on:
  push:
    tags: ['*_v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find the program for this tag
        id: program
        run: |
          python - <<'EOF'
          import json, os, pathlib, sys
          tag = os.environ['GITHUB_REF_NAME']
          for manifest in sorted(pathlib.Path('programs').glob('*/app_files/app_manifest.json')):
              data = json.loads(manifest.read_text(encoding='utf-8'))
              if data['release'] == tag:
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                      out.write('dir=%s\n' % manifest.parent.parent.name)
                      out.write('title=%s\n' % data['title'])
                  sys.exit(0)
          sys.exit('no program has the release name %s (app_manifest.json "release")' % tag)
          EOF

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c programs/AOI_Photo_Sorter/app_files/constraints.txt pywebview Pillow openpyxl numpy matplotlib playwright
          python -m playwright install --with-deps chromium

      - name: Tests
        env:
          AOI_TOOLS_HOME: ${{ runner.temp }}/aoi_tools
        run: |
          python -m unittest discover -s tests -v
          python -m unittest tests.e2e_photo_sorter -v

      - name: Build ZIP
        run: |
          python tools/build_release.py --zip
          # the committed .vbs launchers must be exactly what the template generates
          git diff --exit-code -- programs
          test -f "dist/${GITHUB_REF_NAME}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.program.outputs.title }}
          DIR: ${{ steps.program.outputs.dir }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes="programs/${DIR}/README_KO.txt"
          gh release create "$GITHUB_REF_NAME" "dist/${GITHUB_REF_NAME}.zip" \
            --verify-tag --title "$TITLE" --notes-file "$notes"
